decisoes:
  - id: ADR-001
    titulo: "Stack backend C# .NET 9 (Portaria-master)"
    decisao: "csharp-portaria com Clean Arch + CQRS-lite + MediatR + EF Core 9 + Npgsql"
    motivo: "Padrao da casa, blueprint travado, time familiar"
    consequencia: "Reuso direto do Core/WebApi.Core"

  - id: ADR-002
    titulo: "Stack frontend Next.js 15 + Tailwind + shadcn/ui"
    decisao: "Next.js App Router + TanStack Query + Zod, feature-based"
    motivo: "Padrao da casa; design system Trust & Authority"
    consequencia: "Componentes prontos shadcn aceleram CRUD"

  - id: ADR-003
    titulo: "PostgreSQL 16+"
    decisao: "uuid, timestamptz, jsonb, varchar(200) default"
    motivo: "Convencao do framework; multi-tenant simples por UnidadeId"
    consequencia: "Provider Npgsql; sem cascade delete (ClientSetNull)"

  - id: ADR-004
    titulo: "Multi-tenant via coluna UnidadeId"
    decisao: "HasQueryFilter global no ContextoDB filtra por IUnidadeContext"
    motivo: "Solucao simples; futuro multi-empresa sem refactor"
    consequencia: "Indices precisam compor UnidadeId; admin pode ter contexto null"

  - id: ADR-005
    titulo: "Notificacoes via NotificacaoPendente + BackgroundService"
    decisao: "Persistir notificacao na transacao; worker processa retry com backoff"
    motivo: "Falha de WhatsApp/email nao pode bloquear fluxo de chamada"
    consequencia: "Sem dependencia de fila externa no MVP; alarme se >50 pendentes"

  - id: ADR-006
    titulo: "Realtime via SignalR no proprio backend"
    decisao: "PainelChamadaHub atualiza painel de lideres + portarias"
    motivo: "Stack uniforme, sem servico externo"
    consequencia: "Sticky session necessaria se escalar horizontalmente"

  - id: ADR-007
    titulo: "Auditoria via EventoFluxo (insert-only)"
    decisao: "Toda mudanca de estado/edicao gera EventoFluxo na mesma transacao"
    motivo: "LGPD + seguranca patrimonial"
    consequencia: "Tabela cresce; particionar por mes pos-MVP"

  - id: ADR-008
    titulo: "Lock otimista em MovimentoPortaria"
    decisao: "[Timestamp] em RowVersion + traducao de DbUpdateConcurrencyException -> ConflitoException"
    motivo: "Dois lideres podem clicar Chamar simultaneamente"
    consequencia: "Erro 409 raro; UI mostra mensagem clara"

  - id: ADR-009
    titulo: "Anexos em filesystem local (S3 pos-MVP)"
    decisao: "Path /anexos/{UnidadeId}/{MovimentoId}/{guid}-{nome}.{ext}"
    motivo: "Simples para MVP single-server"
    consequencia: "Backup precisa cobrir filesystem; migrar para object storage em multi-replica"

  - id: ADR-010
    titulo: "Idioma do dominio PT-BR"
    decisao: "Classes, propriedades, comandos, eventos em PT-BR. Termos universais (Repository, Handler) em ingles."
    motivo: "Convencao do framework; codigo le como o negocio fala"
    consequencia: "Sem custo de traducao"

  - id: ADR-011
    titulo: "Sem heranca em Pessoa"
    decisao: "Motorista e Usuario sao agregados separados sem hierarquia"
    motivo: "Ciclos de vida e regras totalmente diferentes; reuso so se aparecer redundancia real"
    consequencia: "Codigo simples sem hierarquia desnecessaria"

  - id: ADR-012
    titulo: "Retencao de dados indefinida"
    decisao: "Sem job de expurgo; anonimizacao manual via solicitacao LGPD"
    motivo: "Decisao explicita do cliente"
    consequencia: "Revisitar quando volume tornar custo relevante"

  - id: ADR-013
    titulo: "Edicao de campos criticos pos-entrada exige Lider+"
    decisao: "Validacao no handler + auditoria via EventoFluxo: EdicaoCampo com diff"
    motivo: "Evita correcao silenciosa de dado oficial; rastreabilidade"
    consequencia: "Porteiro precisa pedir lider em casos raros"

  - id: ADR-014
    titulo: "Web responsivo no MVP, mobile (Flutter) pos-MVP"
    decisao: "API ja exposta via REST estavel; mobile consome mesma API"
    motivo: "Mobile previsto so para anexos do motorista"
    consequencia: "Contratos REST devem ser estaveis"

  - id: ADR-015
    titulo: "Design system Trust & Authority (#334155 / #059669)"
    decisao: "Industrial slate como primary, emerald-600 como accent CTA. Inter typography."
    motivo: "Contexto industrial frigorifico; gerado pela skill ui-ux-pro-max"
    consequencia: "Consultar design-system/controleportaria/MASTER.md antes de criar componentes"

riscos_tecnicos:
  - id: R-001
    titulo: "Evolution API instavel"
    impacto: "Notificacao de chamada pode nao chegar"
    mitigacao: "NotificacaoPendente + retry exponencial + canal redundante (Email + SignalR para portaria)"
  - id: R-002
    titulo: "Anexos em filesystem nao escala horizontal"
    impacto: "Multi-replica precisa storage compartilhado"
    mitigacao: "MVP single-server; migrar para S3-compativel quando escalar"
  - id: R-003
    titulo: "EventoFluxo cresce indefinidamente"
    impacto: "Performance de queries de auditoria a longo prazo"
    mitigacao: "Indices por (MovimentoId, Quando); particionar por mes pos-MVP"
  - id: R-004
    titulo: "Auto-fill por placa pode trazer dados desatualizados"
    impacto: "Porteiro aceita sugestao errada"
    mitigacao: "UI mostra como sugestao com banner; campos editaveis"
  - id: R-005
    titulo: "SignalR precisa de sticky session para escalar"
    impacto: "Painel pode perder updates em multi-instancia"
    mitigacao: "MVP single-instance; usar Redis backplane se escalar"

