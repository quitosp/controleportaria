  provider: Npgsql
  cache: ""
  fila: ""
  auth: "JWT + Identity Framework"
  realtime: "SignalR (mesmo backend)"
  storage: "Filesystem local (S3-compativel pos-MVP)"
  email: "SMTP/SendGrid"
  whatsapp: "Evolution API por Unidade"
  observabilidade: "Serilog JSON + health checks /health/ready/live"

