    - api/compartilhados/webApi.core/WebApi.Core/*
    - api/dominios/Dominios/*
    - api/repositorios/Repositorios/*
    - api/servicos/api/Api/*
    - api/servicos/api/Api/Controllers/AuthController.cs
    - api/servicos/api/Api/Configuration/SeedAdmin.cs
    - web/app/(publico)/login/page.tsx
    - web/app/(privado)/layout.tsx
    - web/components/ui/*
    - web/lib/api.ts
    - web/lib/auth.ts
    - web/app/globals.css
