projeto:
  nome: ControlePortaria
  stack: csharp-portaria
  blueprint: .framework/nucleo/csharp-portaria.md
  stack_frontend: frontend-react
  blueprint_frontend: .framework/nucleo/frontend-react.md

solucao:
  nome_sln: ControlePortaria.sln
  caminho_raiz: ./api
  projetos:
    - nome: Core
      caminho: api/compartilhados/core/Core
      tipo: classlib
    - nome: WebApi.Core
      caminho: api/compartilhados/webApi.core/WebApi.Core
      tipo: classlib
    - nome: Dominios
      caminho: api/dominios/Dominios
      tipo: classlib
    - nome: Repositorios
      caminho: api/repositorios/Repositorios
      tipo: classlib
    - nome: Api
      caminho: api/servicos/api/Api
      tipo: webapi

frontend:
  framework: next-react
  caminho_raiz: ./web
  estrutura:
    - web/app                         # App Router (pages e layouts)
    - web/app/(privado)               # rotas com Layout autenticado (sidebar + topbar)
    - web/app/(publico)/login         # rota publica
    - web/components/ui                # shadcn/ui base
    - web/components/dominio           # componentes de dominio reaproveitaveis
    - web/lib                          # client API, auth, utils
    - web/features/{nome}              # feature-based: page + form + hooks + types
    - web/hooks                        # useApi, useSignalR, useTheme
  tema:
    fonte: design-system/controleportaria/MASTER.md
    primary: "#334155"
    accent: "#059669"
    typography: Inter

abstracoes_dominio:
  value_objects:
    - nome: Placa
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/Placa.cs
      observacao: "string normalizada (sem hifen/espaco, uppercase) com validacao de placa Mercosul ou tradicional"
    - nome: Cpf
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/Cpf.cs
      observacao: "valida algoritmo de CPF"
    - nome: Cnpj
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/Cnpj.cs
      observacao: "valida algoritmo de CNPJ"
    - nome: Whatsapp
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/Whatsapp.cs
      observacao: "string E.164"
    - nome: Lacre
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/Lacre.cs
      observacao: "string nao vazia, max 100"
    - nome: DadosCarga
      arquivos:
        - api/compartilhados/core/Core/ObjetoDominio/DadosCarga.cs
      observacao: "agrupa NumeroNF, Produto, Setor, Contrato, NumeroContainer (todos opcionais)"
  enums:
    - StatusMotorista
    - PapelUsuario
    - TipoVeiculo
    - MotivoEntrada
    - TipoCarga
    - DestinoPateo
    - EstadoMovimento
    - EstagioAnexo
    - TipoEventoFluxo
    - CanalNotificacao
    - StatusNotificacao
  arquivos_enums:
    - api/dominios/Dominios/Compartilhado/Enums/{Enum}.cs

