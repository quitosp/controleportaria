notas: |
  Concluido em 2026-05-07.
  Arquivos criados:
  - Core/ObjetoDominio/Autorizacao/PapelUsuario.cs (enum Porteiro<Lider<Supervisor<Admin)
  - Core/ObjetoDominio/Autorizacao/PoliticasAuth.cs (constantes de policy + claims)
  - WebApi.Core/Multitenant/IUnidadeContext.cs + UnidadeContextHttp.cs (RN-014 multi-tenant)
  - Api/Configuration/AuthorizationConfig.cs (4 policies hierarquicas via RequireAssertion)
  Arquivos editados:
  - WebApi.Core/Usuario/Usuario.cs (+ Papel/UnidadeId/PortariaPadraoId)
  - Api/Identidade/Servicos/AuthenticationService.cs (claims papel/unidadeId/portariaPadraoId/name no JWT)
  - Api/Identidade/SeedAdmin.cs (Admin seed com Papel=Admin)
  - Api/Configuration/DependencyInjectionConfig.cs (registra IUnidadeContext)
  - Api/Startup.cs (chama AddAuthorizationConfiguration)
  - Api/Controllers/AuthController.cs (registrar exige SomenteAdmin; entrar/refresh ficam AllowAnonymous)
  Regras cobertas: RN-001 (auth obrigatoria), RN-014 (multi-tenant via claim), RN-021 (suporte para Lider+ em campos criticos — sera consumido nos handlers de movimento)
  Pendencia: migration (HIST-005 fara apos /criar_banco)
