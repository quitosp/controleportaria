aceite:
- 'Policies definidas: PorteiroOuMaior, LiderOuMaior, SupervisorOuMaior, SomenteAdmin'
- 'JWT contem claims: papel, UnidadeId, PortariaPadraoId'
- Endpoints sensiveis (alterar status motorista, criar usuario, criar unidade) exigem
  SomenteAdmin/SupervisorOuMaior
- Tentativa de acesso sem papel suficiente retorna 403
validacao:
