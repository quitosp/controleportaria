servicos_dominio:
  - nome: NotificacaoWorker
    descricao: "BackgroundService que processa NotificacaoPendente (WhatsApp Evolution + Email + SignalR). Backoff exponencial."
    arquivo: api/servicos/api/Api/BackgroundServices/NotificacaoWorker.cs
    dependencias:
      - IEvolutionApiClient
      - IEmailSender
      - IHubContext<PainelChamadaHub>
      - INotificacaoPendenteRepositorio
  - nome: ChamadaExpiradaWorker
    descricao: "BackgroundService que sinaliza movimentos com chamada expirada (TTL 30min). Roda a cada 1min."
    arquivo: api/servicos/api/Api/BackgroundServices/ChamadaExpiradaWorker.cs
  - nome: EvolutionApiClient
    descricao: "Cliente HTTP para Evolution API (WhatsApp). Configurado por Unidade."
    arquivo: api/servicos/api/Api/Integracoes/EvolutionApiClient.cs
  - nome: EmailSender
    descricao: "Envio via SMTP (default) ou SendGrid (configuravel)."
    arquivo: api/servicos/api/Api/Integracoes/EmailSender.cs
  - nome: AnexoStorage
    descricao: "Persistencia de anexos em filesystem local. Path: /anexos/{UnidadeId}/{MovimentoId}/{guid}-{nome}.{ext}"
    arquivo: api/servicos/api/Api/Integracoes/AnexoStorage.cs
  - nome: UnidadeContext
    descricao: "IUnidadeContext extrai UnidadeId do JWT; usado em filtro global do DbContext."
    arquivo: api/compartilhados/webApi.core/WebApi.Core/Multitenant/UnidadeContext.cs

