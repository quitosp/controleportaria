acessibilidade:
  contraste: "AA"
  navegacao_teclado: true
  aria_labels: true
  foco_visivel: true

notas: |
  Atalhos de teclado importantes:
  - Ctrl+N na tela /chegada cria nova chegada
  - Enter no campo Carreta dispara auto-fill
  - Esc fecha qualquer modal

  Layout privado contem AlternarTema no topbar (canto superior direito).
  SignalR mantem conexao no layout privado e atualiza telas T-002, T-004 e T-008 em tempo real.
  Items da sidebar sao filtrados por papel: Porteiro nao ve Administracao; Lider ve Operacao + cadastros; Supervisor/Admin ve tudo.
