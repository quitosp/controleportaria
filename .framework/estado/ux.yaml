fluxos:
  - nome: "Cadastrar chegada (porteiro)"
    sequencia: [T-001, T-002, T-003, T-008]
    descricao: "Login -> Dashboard -> Cadastrar chegada -> Detalhe do movimento criado"
  - nome: "Chamar veiculo (lider)"
    sequencia: [T-001, T-002, T-004, T-008]
    descricao: "Login -> Dashboard -> Painel chamada -> autoriza entrada -> Detalhe (audit ChamadaAutorizada)"
  - nome: "Confirmar entrada (porteiro)"
    sequencia: [T-005, T-008]
    descricao: "Confirmar entrada -> Detalhe do movimento atualizado"
  - nome: "Registrar saida (porteiro)"
    sequencia: [T-006, T-008]
    descricao: "Saida (campos condicionais) -> Detalhe do movimento finalizado"
  - nome: "Bloquear motorista (supervisor)"
    sequencia: [T-010, T-012]
    descricao: "Lista motoristas -> Detalhe -> alterar status com motivo"
  - nome: "Cadastrar motorista no fluxo"
    sequencia: [T-003, T-003]
    descricao: "Durante chegada, abre modal de novo motorista, fecha e segue cadastro"
  - nome: "Auditoria de movimento (supervisor)"
    sequencia: [T-007, T-008]
    descricao: "Lista movimentos -> Detalhe -> aba Auditoria com EventoFluxo"

